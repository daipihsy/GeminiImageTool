name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the .dmg to (e.g. v2.2.1)"
        required: true
        default: "v2.2.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import sanity check (source)
        run: python -c "import app; app.build_demo(); print('build_demo OK on macOS')"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name GeminiImageTool \
            --collect-all gradio \
            --collect-all gradio_client \
            --collect-all safehttpx \
            --collect-all groovy \
            --copy-metadata gradio \
            --copy-metadata gradio_client \
            --copy-metadata safehttpx \
            --copy-metadata groovy \
            --collect-all google.genai \
            --copy-metadata google-genai \
            --osx-bundle-identifier com.geminiimagetool.app \
            app.py

      - name: Smoke test the built app
        run: |
          BIN="dist/GeminiImageTool.app/Contents/MacOS/GeminiImageTool"
          GRADIO_SERVER_PORT=7860 "$BIN" &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7860/ -o /dev/null; then ok=1; break; fi
            sleep 2
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "App did not serve on :7860"; exit 1; fi
          echo "Smoke test passed: app served the UI."

      - name: Package .dmg
        run: |
          mkdir -p dmg_root
          cp -R "dist/GeminiImageTool.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          hdiutil create -volname "GeminiImageTool" -srcfolder dmg_root -ov -format UDZO \
            "GeminiImageTool-macOS-${TAG}.dmg"
          ls -lh *.dmg

      - name: Upload .dmg to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GeminiImageTool $TAG" --notes "Automated build."
          fi
          gh release upload "$TAG" GeminiImageTool-macOS-*.dmg --clobber

      - name: Upload build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeminiImageTool-macOS
          path: "*.dmg"
          if-no-files-found: ignore
