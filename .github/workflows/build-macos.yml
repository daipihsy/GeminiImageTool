name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the .dmg to (e.g. v2.2.1)"
        required: false
        default: ""
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "app.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "app.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

env:
  DESKTOP_BETA_RELEASE_TAG: v2.3.0-beta.1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import sanity check (source)
        run: python -c "import app; app.build_demo(); print('build_demo OK on macOS')"

      - name: Resolve release tag
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$REQUESTED_RELEASE_TAG"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG="$GITHUB_REF_NAME"
            else
              TAG="$DESKTOP_BETA_RELEASE_TAG"
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build macOS app icon
        run: |
          mkdir -p GeminiImageTool.iconset
          sips -z 16 16 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_16x16.png
          sips -z 32 32 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_32x32.png
          sips -z 64 64 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_128x128.png
          sips -z 256 256 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_256x256.png
          sips -z 512 512 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/GeminiImageTool-icon.png --out GeminiImageTool.iconset/icon_512x512.png
          cp assets/GeminiImageTool-icon.png GeminiImageTool.iconset/icon_512x512@2x.png
          iconutil -c icns GeminiImageTool.iconset -o GeminiImageTool.icns

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name GeminiImageTool \
            --icon GeminiImageTool.icns \
            --collect-all gradio \
            --collect-all gradio_client \
            --collect-all safehttpx \
            --collect-all groovy \
            --copy-metadata gradio \
            --copy-metadata gradio_client \
            --copy-metadata safehttpx \
            --copy-metadata groovy \
            --collect-all google.genai \
            --copy-metadata google-genai \
            --osx-bundle-identifier com.geminiimagetool.app \
            app.py

      - name: Smoke test the built app
        run: |
          BIN="dist/GeminiImageTool.app/Contents/MacOS/GeminiImageTool"
          GRADIO_SERVER_PORT=7860 "$BIN" &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7860/ -o /dev/null; then ok=1; break; fi
            sleep 2
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "App did not serve on :7860"; exit 1; fi
          echo "Smoke test passed: app served the UI."

      - name: Package .dmg
        run: |
          mkdir -p dmg_root
          cp -R "dist/GeminiImageTool.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "GeminiImageTool" -srcfolder dmg_root -ov -format UDZO \
            "GeminiImageTool-macOS-${RELEASE_TAG}.dmg"
          ls -lh *.dmg

      - name: Upload .dmg to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "GeminiImageTool $RELEASE_TAG" --notes "Automated build."
          fi
          gh release upload "$RELEASE_TAG" GeminiImageTool-macOS-*.dmg --clobber

      - name: Upload build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeminiImageTool-macOS
          path: "*.dmg"
          if-no-files-found: ignore
