name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to attach the APK to (for example v2.3.0-beta1)"
        required: false
        default: ""
  push:
    branches: [main, 'feat/android-app']
    tags: ['v*']
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build installable beta
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Give the APK a friendly filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GeminiImageTool-Android-1.0.0-beta1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiImageTool-Android-beta
          path: GeminiImageTool-Android-1.0.0-beta1.apk
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "GeminiImageTool $RELEASE_TAG" --notes "Automated build."
          fi
          gh release upload "$RELEASE_TAG" GeminiImageTool-Android-1.0.0-beta1.apk --clobber
